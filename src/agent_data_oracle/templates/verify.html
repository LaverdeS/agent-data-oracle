{% extends "base.html" %}
{% block title %}Confirm sign-in · Agent Data Oracle{% endblock %}
{% block content %}
  <p class="quiet">Single-use verification</p>
  <h1>Confirm this sign-in</h1>
  <p class="lede">Continue only if you requested this link on this device.</p>
  <form method="post" action="/auth/verify">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="token" value="{{ token }}">
    <button type="submit">Continue securely</button>
  </form>
{% endblock %}
