services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: agent_data_oracle_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_data_oracle_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    profiles: [tools]
    working_dir: /repo
    volumes:
      - .:/repo:ro
    command: ["detect", "--source=/repo", "--redact", "--no-banner"]

volumes:
  postgres-data:
